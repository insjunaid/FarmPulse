version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: farmpulse-db
    environment:
      POSTGRES_USER: farmpulse
      POSTGRES_PASSWORD: farmpulse123
      POSTGRES_DB: farmpulse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farmpulse"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: farmpulse-api
    environment:
      DATABASE_URL: postgresql://farmpulse:farmpulse123@postgres:5432/farmpulse
      MSG91_AUTH_KEY: ${MSG91_AUTH_KEY:-}
      MSG91_SENDER_ID: ${MSG91_SENDER_ID:-FARMPL}
      EXOTEL_API_KEY: ${EXOTEL_API_KEY:-}
      EXOTEL_API_SECRET: ${EXOTEL_API_SECRET:-}
      EXOTEL_VIRTUAL_NUMBER: ${EXOTEL_VIRTUAL_NUMBER:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: farmpulse-web
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  default:
    name: farmpulse-network
